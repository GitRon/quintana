name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes the running build of the same branch or PR obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.QUINTANA_KEYSTORE_BASE64 }}
      QUINTANA_KEYSTORE_PASSWORD: ${{ secrets.QUINTANA_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Formatting
        run: ./gradlew spotlessCheck

      - name: Android Lint
        run: ./gradlew lintDebug || { cat app/build/reports/lint-results-debug.txt; exit 1; }

      - name: Unit tests and coverage
        run: ./gradlew koverXmlReportDebug koverHtmlReportDebug

      - name: Coverage summary
        run: python3 .github/scripts/coverage_summary.py app/build/reports/kover/reportDebug.xml

      # With the signing key from the secrets, build a release APK that installs
      # over the previous one. Without it (pull requests from forks) build a debug APK.
      - name: Build APK
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/quintana.jks"
            export QUINTANA_KEYSTORE="$RUNNER_TEMP/quintana.jks"
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk quintana.apk
          else
            echo "::warning::No signing key in the secrets, building a debug APK that cannot update a signed install"
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk quintana.apk
          fi

      # Quintana works offline. A library can add the permission through
      # manifest merging, so check the APK that ships.
      - name: Check the APK has no internet permission
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          permissions="$("$aapt2" dump permissions quintana.apk)"
          echo "$permissions"
          if grep -q "android.permission.INTERNET" <<< "$permissions"; then
            echo "::error::quintana.apk requests android.permission.INTERNET"
            exit 1
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: quintana-apk
          path: quintana.apk

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/kover/htmlDebug
          if-no-files-found: ignore
